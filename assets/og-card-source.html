<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; width: 1200px; height: 630px;
    background: #101012; color: #ececf1; overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  }
  .wrap {
    width: 1200px; height: 630px; padding: 56px 72px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .brand { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; }
  .brand .sq { width: 14px; height: 28px; border-radius: 3px; }
  .brand span {
    font-size: 19px; letter-spacing: 3px; color: #9a9aa3;
    text-transform: uppercase; font-weight: 600;
  }
  h1 {
    font-size: 38px; line-height: 1.18; margin: 0 0 28px;
    font-weight: 700; letter-spacing: -.01em; max-width: 1020px;
  }
  .imgwrap { width: 560px; height: 255px; overflow: hidden; }
  .imgwrap img { width: 560px; display: block; margin-top: -45px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span class="sq" style="background:#2f9e78"></span>
      <span class="sq" style="background:#7d5fe0"></span>
      <span>Authorship Meter</span>
    </div>
    <h1>How much of a work came from a person, how much<br>from AI — by stage, not by guess.</h1>
    <div class="imgwrap"><img src="authorship-example.svg" alt=""></div>
  </div>
</body>
</html>
